[project]
name = "generate-meeting-notes"
version = "0.1.0"
description = "會議記錄 skill：逐字稿由 Agent 發佈，錄音先萃取 source artifacts 再由 Agent 成稿"
requires-python = ">=3.12"
dependencies = [
    "google-api-python-client>=2.192.0",
    "google-auth>=2.49.0",
    "google-auth-oauthlib>=1.3.0",
    "notebooklm-py[browser]>=0.8.1",
    "slack-sdk>=3.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
