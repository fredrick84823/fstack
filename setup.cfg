# pytest 與 mutmut 的設定都放這裡，不放 pytest.ini —— mutmut 把測試與原始碼複製進
# `mutants/` 時，`also_copy` 只認 setup.cfg / pyproject.toml，不認 pytest.ini。
# 分成兩個檔的話 `mutants/` 底下那次 pytest 會吃不到設定。

[tool:pytest]
# 預設只跑 unit。tests/integration 需要本機安裝版（~/.agents/skills/…），
# 在別台機器與 CI 上不存在，算進綠燈只會虛胖。
testpaths = tests/unit
markers =
    integration: 需要本機安裝版或真實外部服務；CI 一律 skip（tests/integration/conftest.py 自動掛上）

# mutmut 3.x 只讀 setup.cfg 的 [mutmut] 或 pyproject.toml 的 [tool.mutmut]，沒有對應的
# CLI flag。用 `make mutation` 跑 —— 那個 target 會先清快取，並在事後檢查
# BadTestExecutionCommandsException 的次數與 🫥 no-tests 的顆數。
[mutmut]
# 只掛這一支：Seam ① 的純函式全在裡面。NotebookLM 上傳與 Drive I/O 現在零測試，
# 掛進去只會噴一牆 🫥 no-tests，數字沒有意義。檔案層還不夠細 —— 這支檔案裡也有 I/O
# 函式，所以 Makefile 的 PURE 清單再往下切一層到函式。
source_paths=
# bin/parity_skills.py 是 parity 護欄的本體（涵蓋清單 ＋ 兩類比對 ＋ 方向判斷），
# 而 `bin` 本來只出現在 also_copy —— 那是「複製過去讓測試跑得起來」，不是「產 mutant」。
# 少了這一行的後果：`sync_direction` 搬家之後整支檔案不在變異範圍，PURE 掛著它也沒用
#（MUT_FILTER 按函式名過濾，但 mutant 只從 source_paths 產），那七條 case 一顆都不會被問；
# 新增的 _sanitized / _probes / _differs / installed_dir 則完全量不到。
# 守門測試：tests/unit/test_parity_skills.py::test_every_bin_module_is_inside_the_mutation_scope
    bin/parity_skills.py
    skills/comms/generate-meeting-notes/scripts/channel.py
    skills/comms/generate-meeting-notes/scripts/extract_audio_sources.py
    skills/comms/generate-meeting-notes/scripts/history_index.py
    skills/comms/generate-meeting-notes/scripts/local_archive.py
    skills/comms/generate-meeting-notes/scripts/parity.py
    skills/comms/generate-meeting-notes/scripts/push_shared_glossary.py
    skills/comms/generate-meeting-notes/scripts/reconcile_drive.py
# 只跑 tests/unit：integration 吃本機安裝版，鑑別力是零。
pytest_add_cli_args_test_selection=
    tests/unit
# `bin/` 不在 source_paths 裡，但 tests/unit 的黑箱測試要跑 bin/sync-from-installed.sh，
# 而測試是從 `mutants/` 底下執行的。不複製進去 mutmut 收集覆蓋關係那一輪就全紅。
# 同理下面這幾支：tests/unit 直接 import、或把它們當文字讀（`generate_meeting_notes.py`
# 是被「產記錄流程不得碰 push 腳本」那條測試讀原始碼），但它們不在 source_paths
# （不是純函式層），所以不會被當成 mutant 複製過去。少了它們是 collection error 而不是
# 紅測試 —— stats collection 整輪掛掉，而 BadTestExecutionCommandsException 與 🫥 都還是 0。
# 逐檔列，不是整個 `bin` —— bin/parity_skills.py 在 source_paths 裡要產 mutant，
# 被 also_copy 原封不動蓋回去就等於整支不變異，而症狀是「分數很漂亮」。
also_copy=
    bin/sync-from-installed.sh
    bin/sync-to-installed.sh
    bin/crap.py
# tests/unit 有一條測試讀 Makefile 的 PURE 清單（純函式加了沒掛進去就是量不到
# 它）。測試是從 `mutants/` 底下跑的，不複製進去那條會在 stats collection 那輪
# 讀不到檔 —— 整輪掛掉，而 BadTestExecutionCommandsException 與 🫥 都還是 0。
    Makefile
# SKILL.md 同理：#29 的驗收條件之一是「版本來源檢查」那節要是 repo-first，而那條
# 測試讀的是 SKILL.md 本身。它不是 source_paths（不是純函式，沒有 mutant），所以
# 不會被當成要變異的檔案複製過去 —— 少了它一樣是整輪 stats collection 掛掉。
    skills/comms/generate-meeting-notes/SKILL.md
    skills/comms/generate-meeting-notes/scripts/backfill_local_archive.py
    skills/comms/generate-meeting-notes/scripts/create_gdoc_from_md.py
    skills/comms/generate-meeting-notes/scripts/generate_meeting_notes.py
    skills/comms/generate-meeting-notes/scripts/send_slack_notification.py
    skills/comms/generate-meeting-notes/scripts/setup.py
# setup.py 會 copy 一份 references/default-prompt.md 過去。少了 references/ 那條
# 「setup 跳過該題要寫 null」的測試在 mutants/ 底下是 FileNotFoundError —— 一樣是
# stats collection 整輪掛掉，而兩個事後判準都還是 0。
    skills/comms/generate-meeting-notes/references
# tests/unit/test_signal_state.py（#47 加的）起子行程跑
# `skills/skill-evolution/improve/scripts/signal_state.py`，路徑是從**測試自己的檔案位置**
# 推的 —— 測試是從 `mutants/` 底下執行的，不複製進去那支就不存在，`subprocess.run(check=True)`
# 以 FileNotFoundError 收場，stats collection 整輪掛掉。症狀正是 setup.cfg 上面警告過三次的
# 那一種：`make mutation` 一個數字都印不出來，而 BadTestExecutionCommandsException 與 🫥 都還是 0。
# 同一科的病再犯一次（#50 之後）：`test_validator_contract.py` 從**路徑**載
# `evals/run_validator_eval.py`、`references/` 的 schema 與 prompt、以及 improve 的
# SKILL.md 與 repo 的 README.md。少任何一個都是 FileNotFoundError → stats collection
# 整輪掛掉，而 BadTestExecutionCommandsException 與 🫥 都還是 0。
    skills/skill-evolution/improve
    README.md
